name: Release & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to DockerHub
      run: |
        echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_LOGIN }}" --password-stdin

    - name: Build and Push Backend Image
      run: |
        docker build ./backend --file ./backend/Dockerfile -t dmachard/sci-compta-backend:latest -t dmachard/sci-compta-backend:${{ github.ref_name }}
        docker push dmachard/sci-compta-backend:latest
        docker push dmachard/sci-compta-backend:${{ github.ref_name }}

    - name: Build and Push Frontend Image
      run: |
        docker build ./frontend --file ./frontend/Dockerfile --build-arg VITE_APP_VERSION=${{ github.ref_name }} -t dmachard/sci-compta-frontend:latest -t dmachard/sci-compta-frontend:${{ github.ref_name }}
        docker push dmachard/sci-compta-frontend:latest
        docker push dmachard/sci-compta-frontend:${{ github.ref_name }}
